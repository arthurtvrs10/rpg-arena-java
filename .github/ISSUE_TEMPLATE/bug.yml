name: Bug Report
description: Report an unexpected error, reproducible bug, or incorrect domain behavior.
title: "[BUG] "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in RPG Arena!
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Start application with `./mvnw spring-boot:run`
        2. Send request to endpoint `POST /api/v1/...`
        3. Observe error response
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should have happened according to business rules.
    validations:
      required: true
  - type: textarea
    id: logs-errors
    attributes:
      label: Logs / Error Messages
      description: Paste relevant stack traces or Bruno response payloads.
      render: shell
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "priority: critical"
        - "priority: high"
        - "priority: medium"
        - "priority: low"
    validations:
      required: true
