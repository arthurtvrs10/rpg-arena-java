name: CI Pipeline

on:
  push:
    branches:
      - main
      - chore/**
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Build and Execute Tests
        run: |
          if [ -f "pom.xml" ] && [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw clean verify --batch-mode --no-transfer-progress
          elif [ -f "pom.xml" ]; then
            mvn clean verify --batch-mode --no-transfer-progress
          else
            echo "::notice ::Java code and Maven Wrapper bootstrap scheduled for DAY-04. Repository foundation validated successfully."
          fi
